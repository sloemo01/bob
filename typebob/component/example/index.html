<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>typebob · component example</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0e0e11; }
      #root { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px; }
      .stage { width: min(88vw, 760px); height: min(60vh, 420px); }
      #controls {
        display: flex; align-items: center; gap: 12px;
        font: 500 11px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
        letter-spacing: 0.14em; color: rgba(255, 255, 255, 0.42);
      }
      button {
        height: 32px; min-width: 64px; padding: 0 14px; border-radius: 9px;
        border: 1px solid rgba(255, 255, 255, 0.16); background: transparent;
        color: rgba(255, 255, 255, 0.78);
        font: 500 11px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
        letter-spacing: 0.06em; cursor: pointer;
        transition: border-color 0.15s ease, color 0.15s ease;
      }
      button:hover { border-color: rgba(255, 255, 255, 0.45); color: #fff; }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <!-- React from a CDN (no install), then the packed bundle this repo ships.
         Serve the repo over http, e.g.  node component/example/serve.mjs  -->
    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@19.3.0",
          "react/": "https://esm.sh/react@19.3.0/",
          "react-dom": "https://esm.sh/react-dom@19.3.0",
          "react-dom/": "https://esm.sh/react-dom@19.3.0/"
        }
      }
    </script>
    <script type="module">
      import { createElement as h, useRef, useState } from "react";
      import { createRoot } from "react-dom/client";
      import { Typebob } from "../dist/bob.js";

      function App() {
        const bob = useRef(null);
        const [paused, setPaused] = useState(false);
        const [para, setPara] = useState(0);
        return h("div", { id: "root-inner", style: { display: "contents" } },
          h("div", { className: "stage" },
            h(Typebob, {
              ref: bob,
              paused,
              onParagraph: (i) => setPara(i + 1),
            }),
          ),
          h("div", { id: "controls" },
            h("button", { onClick: () => setPaused((p) => !p) }, paused ? "play" : "pause"),
            h("button", { onClick: () => bob.current.setBody("cloud") }, "cloud"),
            h("span", null, `paragraph ${para} / ${bob.current ? bob.current.paragraphs : 5}`),
          ),
        );
      }

      createRoot(document.getElementById("root")).render(h(App));
    </script>
  </body>
</html>
