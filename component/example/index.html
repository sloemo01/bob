<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>bob · component example</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0e0e11; }
      #root { height: 100%; display: flex; align-items: center; justify-content: center; }
      .stack { display: flex; flex-direction: column; align-items: center; gap: 26px; }
      .scene { display: flex; align-items: center; justify-content: center; }
      .scene .bob { width: 340px; }
      .scene .type { width: min(88vw, 720px); height: 380px; }
      #controls {
        display: flex; align-items: center; gap: 12px;
        font: 500 11px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
        letter-spacing: 0.14em; color: rgba(255, 255, 255, 0.42);
      }
      button {
        height: 32px; min-width: 64px; padding: 0 14px; border-radius: 9px;
        border: 1px solid rgba(255, 255, 255, 0.16); background: transparent;
        color: rgba(255, 255, 255, 0.78);
        font: 500 11px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
        letter-spacing: 0.06em; cursor: pointer;
        transition: border-color 0.15s ease, color 0.15s ease;
      }
      button:hover { border-color: rgba(255, 255, 255, 0.45); color: #fff; }
      button.on { border-color: rgba(255, 255, 255, 0.55); color: #fff; }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <!-- React from a CDN (no install), then the packed bundle this repo ships.
         Serve the repo root over http, e.g.  node component/example/serve.mjs  -->
    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@19.3.0",
          "react/": "https://esm.sh/react@19.3.0/",
          "react-dom": "https://esm.sh/react-dom@19.3.0",
          "react-dom/": "https://esm.sh/react-dom@19.3.0/"
        }
      }
    </script>
    <script type="module">
      import { createElement as h, useRef, useState } from "react";
      import { createRoot } from "react-dom/client";
      import { Bob, Typebob } from "../dist/bob.js";

      function App() {
        const bob = useRef(null);
        const [tab, setTab] = useState("bob");
        const [face, setFace] = useState(1);
        const [paused, setPaused] = useState(false);
        return h("div", { className: "stack" },
          tab === "bob"
            ? h("div", { className: "scene" },
                h("div", { className: "bob" },
                  h(Bob, { ref: bob, size: 340, paused, onFace: (i) => setFace(i + 1) }),
                ),
              )
            : h("div", { className: "scene" },
                h("div", { className: "type" },
                  h(Typebob, { paragraphs: [
                    "this one is typed by the same character, from the same bundle. every word lands one character at a time.",
                    "and when the paragraph ends, he folds into the period. then he lifts off and starts the next one.",
                  ] }),
                ),
              ),
          h("div", { id: "controls" },
            h("button", { className: tab === "bob" ? "on" : "", onClick: () => setTab("bob") }, "bob"),
            h("button", { className: tab === "typebob" ? "on" : "", onClick: () => setTab("typebob") }, "typebob"),
            tab === "bob"
              ? h("span", null, `face ${face} / 24`)
              : h("span", null, "typed live"),
          ),
        );
      }

      createRoot(document.getElementById("root")).render(h(App));
    </script>
  </body>
</html>
